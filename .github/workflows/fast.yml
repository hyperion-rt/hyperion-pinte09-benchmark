name: Fast benchmark

# Check that the whole workflow runs with the fast profile against the
# development version of Hyperion. This does not check the results.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      hyperion_ref:
        description: Branch, tag or commit of hyperion-rt/hyperion to test
        default: main

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:

      - name: Check out benchmark
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check out Hyperion
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: hyperion-rt/hyperion
          ref: ${{ inputs.hyperion_ref || 'main' }}
          path: hyperion
          submodules: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      # The LaTeX packages are the ones that Matplotlib needs to render text
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libhdf5-serial-dev libmpich-dev mpich \
            texlive-latex-extra texlive-fonts-recommended cm-super dvipng

      - name: Build Hyperion Fortran binaries
        working-directory: hyperion
        run: |
          ./configure
          make sph_mpi cyl_mpi
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: python -m pip install ./hyperion scipy snakemake

      - name: Run fast benchmark
        run: snakemake --config profile=fast

      - name: Upload plots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: plots
          path: "*_fast/*/plots"

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: logs
          path: |
            *_fast/*/*/*.log
            .snakemake/log
          include-hidden-files: true
